[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "survinsights"
version = "0.0.3"
description = "Interpretation of ML-based survival methods"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Lucas Ducrot", email = "lucas.ducrot@inria.fr" },
  { name = "Van Tuan Nguyen", email = "van-tuan.nguyen@inria.fr" },
]
classifiers = [ ...unchanged, but delete the 3.9 line... ]
dependencies = [
  "lifelines",
  "matplotlib",
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "seaborn",
  "shap",
  "torch",            # imported by _survlongishap.py
]

[project.optional-dependencies]
sim    = ["stochastic>=0.6"]           # longi_simulation (caps numpy<2)
coxsig = ["iisignature"]               
ddh    = ["tensorflow>=2.15", "pyyaml"]
all    = ["survinsights[sim,coxsig,ddh]"]

[tool.hatch.build.targets.wheel]
packages = ["src/survinsights"]

[project.urls]
Documentation = "https://github.com/TeamHeKA/survinsights#README"
Issues = "https://github.com/TeamHeKA/survinsights/issues"
Source = "https://github.com/TeamHeKA/survinsights"

[tool.ruff.lint.extend-per-file-ignores]
"src/survinsights/explainer.py" = ["N801"]
"src/survinsights/global_explaination/_ale.py" = ["N806"]
"src/survinsights/global_explaination/_pdp.py" = ["N806"]
"src/survinsights/performance.py" = ["PLR2004"]
