[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "survinsights"
version = "0.0.3"
description = "Interpretation of ML-based survival methods"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Lucas Ducrot", email = "lucas.ducrot@inria.fr" },
  { name = "Van Tuan Nguyen", email = "van-tuan.nguyen@inria.fr" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "lifelines",
  "matplotlib",
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "seaborn",
  "shap",
  "torch",
]

[project.optional-dependencies]
sim = ["stochastic>=0.6"]
coxsig = ["iisignature"]
ddh = ["tensorflow>=2.15", "pyyaml"]
all = ["survinsights[sim,coxsig,ddh]"]

[project.urls]
Documentation = "https://github.com/TeamHeKA/survinsights#README"
Issues = "https://github.com/TeamHeKA/survinsights/issues"
Source = "https://github.com/TeamHeKA/survinsights"

[tool.hatch.build.targets.wheel]
packages = ["src/survinsights"]

[tool.ruff.lint.extend-per-file-ignores]
"src/survinsights/explainer.py" = ["N801"]
"src/survinsights/global_explaination/_ale.py" = ["N806"]
"src/survinsights/global_explaination/_pdp.py" = ["N806"]
"src/survinsights/performance.py" = ["PLR2004"]
